<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0c0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Entre Amigos">
<title>Entre Amigos | Acceso</title>
<link rel="apple-touch-icon" href="../assets/img/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="app.css?v=9">
</head>
<body>
<div class="wrap">
  <header class="top">
    <img src="../assets/img/logo-mark.png" alt="" width="58" height="37">
    <div class="wm"><b>Entre <i>Amigos</i></b><span id="who">Préstamos y cotizaciones</span></div>
    <button class="link" id="b-out" type="button" hidden>Salir</button>
  </header>

  <!-- Cargando -->
  <section id="v-load" class="card center"><p class="muted">Cargando…</p></section>

  <!-- Acceso -->
  <section id="v-login" class="card" hidden>
    <h1 id="l-title">Entra a tu cuenta</h1>
    <p class="muted" id="l-sub">Usa tu cuenta de Google o tu correo.</p>
    <div id="l-tipo-w" hidden>
      <p class="muted" style="margin-bottom:6px">¿Cómo vas a usar tu cuenta?</p>
      <div class="seg" id="l-tipo"><button type="button" data-tipo="cliente" aria-pressed="true">Soy cliente</button><button type="button" data-tipo="colaborador" aria-pressed="false">Soy colaborador</button></div>
    </div>
    <button class="btn google" id="b-google" type="button"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Continuar con Google</button>
    <div class="or"><span>o con tu correo</span></div>
    <form id="f-login" novalidate>
      <label for="l-nom" id="l-nom-l" hidden>Tu nombre<input id="l-nom" autocomplete="name" placeholder="Nombre y apellido"></label>
      <label for="l-tel" id="l-tel-l" hidden>Tu WhatsApp (para avisarte)<input id="l-tel" type="tel" inputmode="tel" autocomplete="tel" placeholder="33 1234 5678"></label>
      <label for="l-mail">Correo<input id="l-mail" type="email" autocomplete="email" inputmode="email" placeholder="tucorreo@ejemplo.com"></label>
      <label for="l-pass">Contraseña<input id="l-pass" type="password" autocomplete="current-password" placeholder="Mínimo 6 caracteres"></label>
      <p class="err" id="l-err" hidden></p>
      <button class="btn primary" type="submit" id="b-login">Entrar</button>
    </form>
    <p class="swap"><span id="l-q">¿Primera vez?</span> <button class="link" type="button" id="b-swap">Crea tu cuenta</button></p>
    <p class="swap"><button class="link" type="button" id="b-forgot">Olvidé mi contraseña</button></p>
  </section>

  <!-- En revisión -->
  <section id="v-pend" class="card" hidden>
    <h1 id="p-h">Cuenta inactiva</h1>
    <p id="p-txt"><b id="p-nom"></b>, tu cuenta está desactivada por el momento.</p>
    <a class="btn ghost" id="p-wa" href="https://wa.me/523333063319" target="_blank" rel="noopener">Escríbenos por WhatsApp</a>
  </section>

  <!-- App -->
  <section id="v-app" hidden>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <div id="notice"></div>
    <div id="panel"></div>
  </section>
</div>
<script type="module" src="app.js?v=19"></script>
</body>
</html>
