<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mezcal Quarter Horses</title>
<meta name="description" content="Sementales Quarter Horse y crianza de potrillos en Zapopan, Jalisco.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0c;--panel:#151517;--panel2:#1d1d20;--line:#2c2c30;--text:#f7f5f2;--muted:#a9a6a2;--gold:#d6aa4e;--gold2:#efcd7e;--wine:#b3202a;--r:18px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:100px}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
.serif{font-family:"Barlow Semi Condensed",Inter,sans-serif;letter-spacing:-.01em}
.eyebrow{color:var(--gold);font-size:13px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:2px solid var(--gold);color:var(--gold);background:none;padding:15px 26px;font-size:16px;font-weight:600;border-radius:999px;transition:.2s;cursor:pointer;min-height:54px}
.btn:hover{background:#d6aa4e22}
.btn.solid{background:var(--gold);color:#0b0b0c}
.btn.solid:hover{background:var(--gold2)}
.btn.wa{background:#1f7a4a;border-color:#1f7a4a;color:#fff}
.btn.wa:hover{background:#25915a}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn svg{width:22px;height:22px;flex:none}
section{padding:clamp(64px,10vw,120px) clamp(16px,5vw,56px)}
.wrap{max-width:1200px;margin:0 auto}
h2.big{font-size:clamp(36px,5.4vw,60px);font-weight:700;line-height:1.05}
.lead{color:var(--muted);font-size:clamp(17px,1.6vw,19px);max-width:620px;margin-top:12px}

header{position:fixed;inset:0 0 auto;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:12px clamp(16px,4vw,44px);transition:background .3s}
header.solid{background:#0b0b0cf2;backdrop-filter:blur(8px);box-shadow:0 1px 0 var(--line)}
header .logo img{height:74px;width:auto;filter:drop-shadow(0 2px 6px #000a)}
nav{display:flex;gap:clamp(14px,2vw,26px);align-items:center;font-size:15px;font-weight:500}
nav a:hover{color:var(--gold)}
nav .cta{background:var(--gold);color:#0b0b0c;padding:10px 18px;border-radius:999px;font-weight:600}
nav .cta:hover{background:var(--gold2);color:#0b0b0c}
.lang{display:flex;background:#0008;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;color:var(--muted);font-weight:700;font-size:13px;padding:8px 12px;cursor:pointer}
.lang button.on{background:var(--gold);color:#000}
@media(max-width:1060px){nav .hide-m{display:none}}
@media(max-width:560px){header .logo img{height:48px}nav .cta{display:none}}

.hero{position:relative;min-height:100svh;display:flex;align-items:flex-end;padding:0 clamp(16px,6vw,80px) clamp(56px,10vh,110px);overflow:hidden}
.slides{position:absolute;inset:0}
.slides img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.6s ease}
.slides img.on{opacity:1;animation:kb 9s ease-out forwards}
@keyframes kb{from{transform:scale(1.1)}to{transform:scale(1)}}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#000c 0%,#0006 50%,#0000 80%),linear-gradient(0deg,var(--bg) 0%,#0000 40%)}
.hero .in{position:relative;z-index:1;max-width:680px}
.hero h1{font-size:clamp(46px,7.6vw,92px);line-height:1;font-weight:700}
.hero h1 em{font-style:normal;color:var(--gold2)}
.hero p{color:#e4ddd2;margin:18px 0 30px;font-size:clamp(17px,1.8vw,20px);max-width:540px}
.hero .row{display:flex;gap:12px;flex-wrap:wrap}
.dots{position:absolute;right:clamp(16px,5vw,60px);bottom:44px;z-index:1;display:flex;gap:8px}
.dots i{width:9px;height:9px;border-radius:50%;background:#fff5}
.dots i.on{background:var(--gold)}
@media(max-width:620px){.slides img{object-position:70% 40%}.hero:after{background:linear-gradient(0deg,var(--bg) 0%,#000c 52%,#0002 85%)}.hero .btn{width:100%}.dots{display:none}}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:0 clamp(16px,5vw,56px);max-width:1312px;margin:28px auto 0;position:relative;z-index:2}
.stats div{padding:22px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);text-align:center}
.stats b{display:block;font:700 clamp(40px,5.4vw,60px)/1 "Barlow Semi Condensed",Inter,sans-serif;background:linear-gradient(180deg,#f3dca8,#c9993f);-webkit-background-clip:text;background-clip:text;color:transparent}
.stats span{font-size:14px;color:var(--muted)}
@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}}

.como{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:36px}
.como div{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:28px}
.como .n{line-height:1;width:52px;height:52px;border-radius:50%;background:var(--gold);color:#0b0b0c;display:grid;place-items:center;font:700 22px Inter,sans-serif;margin-bottom:16px}
.como h3{font-size:21px;font-weight:600;margin-bottom:6px}
.como p{color:var(--muted)}
@media(max-width:820px){.como{grid-template-columns:1fr}}

.rancho{display:grid;grid-template-columns:1fr 1fr;gap:clamp(32px,6vw,80px);align-items:center}
.rancho .pics{display:grid;grid-template-columns:1.3fr 1fr;gap:12px}
.rancho .pics img{width:100%;height:100%;object-fit:cover;border-radius:var(--r);aspect-ratio:3/4}
.rancho .pics img:last-child{margin-top:48px}
.rancho p{color:#ddd5c9;margin-top:16px;font-size:18px}
.note{display:inline-block;margin-top:16px;font-size:13px;color:var(--gold);border:1px dashed #d6aa4e88;padding:6px 12px;border-radius:999px}
.loc{margin-top:28px;padding:20px 22px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.loc h4{font-size:20px;font-weight:600}
.loc p{margin:0;font-size:15px;color:var(--muted)}
@media(max-width:860px){.rancho{grid-template-columns:1fr}}

.chips{display:flex;gap:10px;flex-wrap:wrap;margin:26px 0 30px}
.chip{border:2px solid var(--line);background:var(--panel);color:var(--text);padding:10px 20px;font-size:15px;font-weight:600;cursor:pointer;border-radius:999px}
.chip.on{border-color:var(--gold);background:var(--gold);color:#0b0b0c}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.card{position:relative;cursor:pointer;border:0;background:var(--panel);display:flex;flex-direction:column;width:100%;text-align:left;border-radius:var(--r);overflow:hidden;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-4px);box-shadow:0 18px 40px #0009}
.card .ph{aspect-ratio:4/5;overflow:hidden;position:relative}
.card .ph img{width:100%;height:100%;object-fit:cover;transition:transform .7s}
.card:hover .ph img{transform:scale(1.05)}
.card .tx{padding:18px 20px 20px}
.card .n{font:700 27px/1.05 "Barlow Semi Condensed",Inter,sans-serif}
.card .k{color:var(--gold2);font-size:14px;font-weight:600;margin-top:4px;min-height:1.2em}
.card .m{color:var(--muted);font-size:15px;margin-top:8px}
.card .more{margin-top:14px;display:inline-flex;align-items:center;gap:6px;color:var(--gold);font-weight:600;font-size:15px}
.badge{position:absolute;top:14px;left:14px;background:var(--wine);color:#fff;font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px}

dialog{border:0;padding:0;background:var(--bg);color:var(--text);width:100%;max-width:100%;height:100%;max-height:100%;margin:0}
dialog::backdrop{background:#000d}
dialog .f{border-radius:inherit}
@media(min-width:1000px){dialog{width:min(1200px,94vw);height:min(860px,92vh);margin:auto;border-radius:28px}}
.f{display:grid;grid-template-columns:1fr;height:100%;overflow:auto}
@media(min-width:1000px){.f{grid-template-columns:1.05fr 1fr;overflow:hidden}}
.f .left{background:#000;position:relative;min-height:58vh;overflow:hidden}
.f .left:before{content:"";position:absolute;inset:-30px;background:var(--bgimg) center/cover;filter:blur(28px) brightness(.4)}
@media(min-width:1000px){.f .left{min-height:0}}
.f .left img.main{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding-bottom:84px}
.thumbs{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:8px;overflow-x:auto}
.thumbs button{flex:0 0 66px;height:66px;border:2px solid #fff4;padding:0;background:#000;cursor:pointer;border-radius:12px;overflow:hidden}
.thumbs button.on{border-color:var(--gold)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.f .right{padding:clamp(22px,3vw,40px);overflow:auto}
.x{position:fixed;top:14px;right:14px;background:#000b;border:1px solid var(--line);color:var(--text);height:46px;padding:0 18px;border-radius:999px;font-size:15px;font-weight:600;cursor:pointer;z-index:3;display:flex;align-items:center;gap:8px}
@media(min-width:1000px){.x{position:absolute}}
.f h2{font-size:clamp(34px,4vw,50px);font-weight:700;line-height:1;padding-right:100px}
.f .k{color:var(--gold2);font-size:16px;font-weight:600;margin-top:6px}
.f .desc{margin:16px 0 20px;color:#e2dacd;font-size:17px}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.quick span{background:var(--panel2);padding:7px 14px;border-radius:999px;font-size:14px}
.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.tabs button{background:var(--panel);border:2px solid var(--line);color:var(--text);padding:9px 18px;font-size:15px;font-weight:600;cursor:pointer;border-radius:999px}
.tabs button.on{border-color:var(--gold);color:var(--gold)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.facts div{padding:14px;background:var(--panel);border-radius:14px}
.facts .full{grid-column:1/-1}
.facts dt{font-size:13px;color:var(--muted)}
.facts dd{margin-top:2px;font-size:16px;font-weight:500}
.small{font-size:14px;color:var(--muted);margin-top:12px}
.fam{display:grid;gap:10px}
.fam .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fam .p{background:var(--panel);border-radius:16px;padding:14px 16px}
.fam .p small{display:block;color:var(--muted);font-size:13px}
.fam .p b{font-weight:600;font-size:16px}
.fam .p.leg b{color:var(--gold2)}
.fam .p em{display:block;font-style:normal;color:var(--muted);font-size:13.5px;margin-top:3px}
.fam .gp{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.fam .gp span{font-size:13.5px;background:var(--panel2);border-radius:10px;padding:6px 9px}
.fam .gp span.leg{color:var(--gold2)}
.video-empty{aspect-ratio:16/9;border:2px dashed var(--line);border-radius:var(--r);display:grid;place-items:center;text-align:center;color:var(--muted);background:var(--panel);padding:16px}
.video-empty b{display:block;color:var(--text);font-size:20px}
.f .actions{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap}

/* caballeriza */
.stable{position:relative;height:100svh;min-height:600px;background:radial-gradient(700px 500px at 0% 100%,#3a0d10 0%,transparent 70%),#000;padding:96px 8px 8px;display:grid;grid-template-columns:minmax(320px,31%) 1fr;gap:8px}
.panels{display:flex;gap:6px;height:100%}
.st{position:relative;flex:1;min-width:0;overflow:hidden;border-radius:20px;cursor:pointer;transition:flex .8s cubic-bezier(.2,.8,.2,1);border:0;padding:0;background:#000;text-align:left;color:#fff}
.st img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(.75) brightness(.5);transition:filter .8s,transform 1.2s}
.st:hover img{filter:grayscale(.2) brightness(.8)}
.st.on{flex:8}
.st.on img{filter:none;transform:scale(1.03)}
.st .v{position:absolute;bottom:18px;left:50%;transform:translateX(-50%) rotate(180deg);writing-mode:vertical-rl;font-size:12px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:#ffffffcc;white-space:nowrap;transition:opacity .3s}
.st.on .v{opacity:0}
.st .lab{position:absolute;left:0;right:0;bottom:0;padding:clamp(18px,3vw,34px);background:linear-gradient(0deg,#000e 10%,#0000);opacity:0;transform:translateY(16px);transition:opacity .5s .25s,transform .5s .25s}
.st.on .lab{opacity:1;transform:none}
.st .lab b{display:block;font:700 clamp(30px,3.8vw,56px)/1 "Barlow Semi Condensed",Inter,sans-serif}
.st .lab b.long{font-size:clamp(22px,2.2vw,36px)}
.st .lab i{display:block;font-style:normal;color:var(--gold2);font-weight:600;font-size:clamp(15px,1.4vw,19px);margin-top:6px}
.st .lab span.go{display:inline-flex;margin-top:14px;background:var(--gold);color:#0b0b0c;font-weight:600;font-size:15px;padding:10px 18px;border-radius:999px}
.st .bdg{position:absolute;top:16px;left:16px;background:var(--wine);font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;opacity:0;transition:opacity .4s}
.st.on .bdg{opacity:1}
.cap{align-self:center;padding:0 clamp(16px,2.5vw,36px)}
.cap p{color:#ddd5c9;margin:16px 0 22px;font-size:17px}
.cap .row{display:flex;gap:10px;flex-wrap:wrap}
.cap .eyebrow{text-shadow:0 1px 8px #000}
.cap h1{font-size:clamp(34px,4.6vw,64px);line-height:1;font-weight:700;text-shadow:0 2px 24px #000c}
.cap h1 em{font-style:normal;color:var(--gold2)}
.cap .tag{display:inline-block;margin-top:14px;background:#000a;border:1px solid #ffffff33;padding:7px 14px;border-radius:999px;font-size:14px;font-weight:600;backdrop-filter:blur(4px)}
@media(max-width:760px){
  .stable{height:auto;min-height:0;padding:0;display:block}
  .cap{position:relative;top:auto;left:auto;max-width:none;padding:84px 18px 14px}
  .cap p,.cap .row{display:none}
  .cap h1{font-size:34px}
  .cap .tag{margin-top:10px}
  .panels{overflow-x:auto;scroll-snap-type:x mandatory;padding:0 18px 18px;gap:12px;height:auto}
  .st{flex:0 0 84%;aspect-ratio:4/5;scroll-snap-align:center}
  .st.on{flex:0 0 84%}
  .st img{filter:none}
  .st .lab{opacity:1;transform:none}
  .st .v{display:none}.st .bdg{opacity:1}
  body.v-potrillos .stable,body.v-nosotros .stable{padding-top:82px}
}
.ticker{display:flex;align-items:stretch;background:linear-gradient(90deg,var(--gold),var(--gold2));color:#0b0b0c;font-weight:600;overflow:hidden;font-size:16px}
.tk-l{background:var(--wine);color:#fff;padding:13px 20px;text-transform:uppercase;font-size:13px;letter-spacing:.14em;flex:none;display:flex;align-items:center}
.tk{overflow:hidden;flex:1;display:flex;align-items:center}
.tk-in{display:inline-flex;gap:56px;white-space:nowrap;animation:tk 60s linear infinite;padding-left:28px}
.tk:hover .tk-in{animation-play-state:paused}
.tk-in a,.tk-in span{display:inline-flex;gap:10px;align-items:center}
.tk-in em{font-style:normal;background:#0b0b0c;color:var(--gold2);font-size:12px;padding:2px 8px;border-radius:99px}
.tk-in a{text-decoration:underline;text-underline-offset:3px}
@keyframes tk{to{transform:translateX(-50%)}}
.win{position:relative;min-height:0;height:100%}
.pane{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s,visibility .5s}
.pane.on{opacity:1;visibility:visible}
.pane .panels{height:100%}
.wtabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px}
.wtabs button{background:#ffffff10;border:2px solid #ffffff26;color:var(--text);padding:12px 20px;border-radius:999px;font-weight:600;font-size:16px;cursor:pointer}
.wtabs button.on{background:var(--gold);border-color:var(--gold);color:#0b0b0c}
.wtabs button:not(.on):hover{border-color:var(--gold)}
.st .bdg.pn{background:#1f5f7a}
.nos{display:grid;grid-template-columns:1.1fr 1fr;gap:8px;border-radius:20px;overflow:hidden;background:var(--panel)}
.nos .nimg img{width:100%;height:100%;object-fit:cover}
.nos .ntx{padding:clamp(20px,3vw,40px);overflow:auto;align-self:center}
.nos h2{font-size:clamp(30px,3.4vw,48px);font-weight:700;line-height:1.05}
.nos p{color:#ddd5c9;margin-top:14px;font-size:18px}
.claims{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-bottom:1px solid var(--line);background:var(--panel)}
.claims div{display:flex;gap:12px;align-items:center;padding:20px clamp(14px,2vw,28px);border-right:1px solid var(--line);font-weight:600;font-size:16px;line-height:1.3}
.claims div:last-child{border-right:0}
.claims svg{width:30px;height:30px;flex:none;color:var(--gold)}
@media(max-width:900px){.claims{grid-template-columns:1fr 1fr}.claims div:nth-child(2){border-right:0}.claims div:nth-child(-n+2){border-bottom:1px solid var(--line)}}
.tlw{padding-top:clamp(40px,6vw,64px);padding-bottom:clamp(40px,6vw,64px)}
.tl{list-style:none;display:grid;grid-template-columns:repeat(5,1fr);position:relative;margin-top:10px}
.tl:before{content:"";position:absolute;left:10%;right:10%;top:21px;height:3px;background:linear-gradient(90deg,var(--gold),var(--wine))}
.tl li{position:relative;text-align:center;padding:0 8px}
.tl li i{display:grid;place-items:center;width:44px;height:44px;margin:0 auto 12px;border-radius:50%;background:var(--bg);border:3px solid var(--gold);font:700 17px Inter,sans-serif;font-style:normal;color:var(--gold2);position:relative}
.tl li:last-child i{background:var(--gold);color:#0b0b0c}
.tl li b{display:block;font-size:16px;font-weight:600;line-height:1.3}
.tl li small{color:var(--muted);font-size:13.5px}
@media(max-width:760px){.tl{grid-template-columns:1fr;gap:14px}.tl:before{left:21px;right:auto;top:10px;bottom:10px;width:3px;height:auto;background:linear-gradient(180deg,var(--gold),var(--wine))}.tl li{display:flex;gap:14px;align-items:center;text-align:left;padding:0}.tl li i{margin:0;flex:none}}
.panza{background:var(--panel)}
.pz{display:grid;grid-template-columns:1fr 1.15fr;gap:clamp(24px,5vw,64px);align-items:center}
@media(max-width:900px){.pz{grid-template-columns:1fr}}
.calc{background:var(--panel);border:2px solid var(--gold);border-radius:30px;padding:clamp(18px,3vw,30px);min-width:0}
.calc .lbl{font-weight:600;font-size:15px;margin:0 0 10px}
.fp{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fpi{background:var(--bg);border:2px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;text-align:left;padding:0;position:relative}
.fpi img{width:100%;aspect-ratio:4/3;object-fit:cover}
.fpi div{padding:10px 12px;font-size:14px;line-height:1.3}
.fpi b{display:block;font-size:15px}
.fpi span{color:var(--gold2);font-size:13px}
.fpi.on{border-color:var(--gold);box-shadow:0 0 0 3px #d6aa4e44}
.fpi em{position:absolute;top:8px;left:8px;font-style:normal;font-size:11px;font-weight:600;background:#1f5f7a;color:#fff;padding:3px 8px;border-radius:99px}
.engs{display:flex;gap:8px;flex-wrap:wrap}
.engs button{background:var(--bg);border:2px solid var(--line);border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer}
.engs button.on{border-color:var(--gold);color:var(--gold)}
.big-n{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
.big-n div{background:var(--bg);border-radius:18px;padding:16px}
.big-n small{color:var(--muted);font-size:13.5px;display:block}
.big-n b{font:700 clamp(26px,3vw,36px)/1.1 "Barlow Semi Condensed",Inter,sans-serif;color:var(--gold2)}
.ex{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#0b0b0c;background:var(--gold2);padding:2px 8px;border-radius:99px;margin-left:6px;vertical-align:middle}
@media(max-width:760px){.win{height:auto}.pane{position:static;display:none}.pane.on{display:block}.nos{grid-template-columns:1fr;margin:0 18px 18px}.nos .nimg{aspect-ratio:4/3}.wtabs button{padding:10px 14px;font-size:15px}}
/* confianza */

/* ---------- colores ---------- */
function parse(g) { const o = { E: ['E', 'e'], A: ['A', 'a'], Cr: ['n', 'n'], Rn: ['n', 'n'] };
  g.split(' ').forEach(x => { if (/^[Ee]{2}$/.test(x)) o.E = [x[0], x[1]]; else if (/^[Aa]{2}$/.test(x)) o.A = [x[0], x[1]]; else if (x.includes('Cr')) o.Cr = x === 'CrCr' ? ['Cr', 'Cr'] : ['n', 'Cr']; else if (x.includes('Rn')) o.Rn = x === 'RnRn' ? ['Rn', 'Rn'] : ['n', 'Rn']; });
  return o; }
function cross(g1, g2) {
  const a = parse(g1), b = parse(g2), out = {};
  for (const e1 of a.E) for (const e2 of b.E) for (const a1 of a.A) for (const a2 of b.A) for (const c1 of a.Cr) for (const c2 of b.Cr) for (const r1 of a.Rn) for (const r2 of b.Rn) {
    const E = e1 === 'E' || e2 === 'E', A = a1 === 'A' || a2 === 'A', cr = (c1 === 'Cr') + (c2 === 'Cr'), rn = r1 === 'Rn' || r2 === 'Rn';
    let base = !E ? 'alazan' : A ? 'colorado' : 'negro', k;
    if (rn && cr === 0) k = base === 'alazan' ? 'rosillo' : base === 'colorado' ? 'rosillo_c' : 'moro';
    else k = cr === 0 ? base : cr === 1 ? { alazan: 'palomino', colorado: 'bayo', negro: 'ahumado' }[base] : { alazan: 'cremello', colorado: 'perlino', negro: 'smoky' }[base];
    out[k] = (out[k] || 0) + 1 / 256;
  }
  return out;
}
function predict(stallion, mareColor) {
  const list = MARES[mareColor], tot = {};
  list.forEach(g => { const r = cross(stallion.genotipo, g); for (const k in r) tot[k] = (tot[k] || 0) + r[k] / list.length; });
  return Object.entries(tot).sort((a, b) => b[1] - a[1]).filter(x => x[1] >= .04);
}

  result();
}
function result() {
  const s = S.find(x => x.id === sim.id), res = predict(s, sim.color);
  const notes = [];
  if (sim.color === 'tordillo') notes.push(t('res_gris'));
  if (sim.color === 'pinto') notes.push(t('res_pinto'));
  const blood = [...new Set([s.pedigri_completo[0], ...s.lineas.map(l => l === 'Gunner' ? 'Colonels Smoking Gun' : l)])].filter(n => leg(n)).slice(0, 4);
  $('#result').innerHTML = `
    <div><div class="who"><img src="${esc(s.fotos[0])}" alt=""><span class="plus">+</span><div class="mare" style="background:${SW[sim.color]}">${t('c_' + sim.color)}</div></div>
      <p class="small">${esc(s.nombre)}${s.apodo ? ' · ' + esc(s.apodo) : ''}</p></div>
    <div><h3>${t('res_titulo')}</h3>
      <div class="bars">${res.map(([k, v]) => `<div class="bar"><i style="background:${SW[k]}"></i><div class="t"><b>${PH[L][k]}${L === 'es' && AQ[k] !== PH.es[k] ? ` <small style="color:var(--muted);font-weight:500">(${AQ[k]})</small>` : ''}</b>${DESC[L][k] ? `<small style="color:var(--muted)">${DESC[L][k]}</small>` : ''}<div><span style="width:${Math.round(v * 100)}%"></span></div></div><div class="pct">${Math.round(v * 100)}%</div></div>`).join('')}</div>
      ${notes.map(n => `<div class="info">${esc(n)}</div>`).join('')}
      <p class="small">${t('res_nota')}</p>
      ${blood.length ? `<p class="small" style="color:var(--text)">${t('res_sangre')}:</p><div class="sangre">${blood.map(b => `<span>${esc(legName(b))}</span>`).join('')}</div>` : ''}
    </div>`;
  const msg = (L === 'es' ? `Hola, me interesa una maquila de ${s.nombre} para mi yegua ${t('c_' + sim.color).toLowerCase()}.` : `Hi, I'm interested in breeding my ${t('c_' + sim.color).toLowerCase()} mare to ${s.nombre}.`);
  $('#simWa').innerHTML = WA_ICON + t('cruza_wa'); $('#simWa').href = waLink(msg);
  papaRes();
}
function papaRes() {
  const v = norm(sim.papa), s = S.find(x => x.id === sim.id);
  if (!v) { $('#qPapaRes').innerHTML = ''; return; }
  const k = Object.keys(D.sitio.leyendas).find(l => norm(l) === v || norm(leg(l).alias) === v);
  const shared = s.pedigri_completo.filter(n => norm(n) === v || (k && n === k)).length;
  const out = [];
  if (k) out.push(`<span>${esc(legName(k))}: ${esc(leg(k)[L])}</span>`);
  if (shared) out.push(`<span>${L === 'es' ? `También está en la familia de ${esc(s.apodo || s.nombre)}` : `Also in ${esc(s.apodo || s.nombre)}'s family`}</span>`);
  $('#qPapaRes').innerHTML = out.join('');
}
$('#qColors').onclick = e => { const b = e.target.closest('.col'); if (b) { sim.color = b.dataset.c; renderSim(); } };
$('#qPicks').onclick = e => { const b = e.target.closest('.pick'); if (b) { sim.id = b.dataset.id; renderSim(); } };
$('#qPapers').onclick = e => { const b = e.target.closest('.paper'); if (b) { sim.papers = b.dataset.p; renderSim(); } };
$('#qPapa').addEventListener('input', e => { sim.papa = e.target.value; papaRes(); });
$('#simBook').onclick = () => { bk.id = sim.id; bk.step = 1; renderBook(); go('apartar'); };

/* ---------- confianza ---------- */
function renderConf() {
  const nm = id => { const x = S.find(s => s.id === id); return x ? (x.apodo || x.nombre) : ''; };
  $('#tests').innerHTML = D.testimonios.map(c => `<div class="tcard"><div class="tp">${c.foto ? `<img src="${esc(c.foto)}" alt="">` : (L === 'es' ? 'Foto del potrillo' : 'Foal photo')}</div>
    <div class="tb"><q>${esc(c[L])}</q><div class="who"><div><b>${esc(c.nombre)}</b><small>${esc(c.lugar)}</small></div>${c.semental ? `<span class="chipx">${t('hijo_de')} ${esc(nm(c.semental))}</span>` : ''}</div></div></div>`).join('');
  const f = D.potrillos.map(p => `<div class="foal"><img src="${esc(p.foto)}" alt="" loading="lazy"><span>${esc(p[L])}</span></div>`);
  while (f.length < 4) f.push(`<button class="foal empty" data-up>${t('pot_tuyo')}</button>`);
  $('#foals').innerHTML = f.join('');
  $('#upSire').innerHTML = `<option value="">—</option>` + S.map(x => `<option value="${x.id}">${esc(x.apodo || x.nombre)}</option>`).join('');
}
$('#foals').addEventListener('click', e => { if (e.target.closest('[data-up]')) $('#up').scrollIntoView({ behavior: 'smooth', block: 'center' }); });
const upCheck = () => { $('#upBtn').disabled = !($('#upFile').files.length && $('#upOk').checked); };
$('#upFile').addEventListener('change', e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { $('#upPrev').src = r.result; $('#upPrev').hidden = false; }; r.readAsDataURL(f); upCheck(); });
$('#upOk').addEventListener('change', upCheck);
$('#up').addEventListener('submit', e => { e.preventDefault(); $('#upDone').innerHTML = `<b>${t('sube_gracias')}</b>`; $('#upDone').classList.add('on'); $('#upBtn').disabled = true; });

/* ---------- apartar ---------- */
function renderBook() {
  [...$('#steps').children].forEach((d, i) => { d.className = i + 1 === bk.step ? 'on' : i + 1 < bk.step ? 'done' : ''; });
  const s = S.find(x => x.id === bk.id); let h = '';
  if (bk.step === 1) {
    h = `<label class="l">${t('elige_semental')}</label><div class="picks" id="bPicks">${S.map(x => `<button class="pick ${x.id === bk.id ? 'on' : ''}" data-id="${x.id}"><img loading="lazy" src="${esc(x.fotos[0])}" alt=""><div><b>${esc(x.apodo || x.nombre)}</b><span>${esc(x.color[L])}</span></div></button>`).join('')}</div>
      <label class="l">${t('modalidad')}</label><div class="opts">${['fresco', 'congelado', 'monta'].map(m => `<label class="opt"><input type="radio" name="bm" value="${m}" ${bk.mod === m ? 'checked' : ''}><div><b>${t('mod_' + m)}</b><span>${t('mod_' + m + '_t')}</span></div></label>`).join('')}</div>
      <div class="nav-b"><span></span><button class="btn solid" data-go="2">${t('siguiente')} &rarr;</button></div>`;
  } else if (bk.step === 2) {
    h = `<div class="two"><div><label class="l">${t('tu_nombre')}</label><input class="inp" id="bN" value="${esc(bk.nombre)}" autocomplete="name"></div><div><label class="l">${t('tu_whatsapp')}</label><input class="inp" id="bW" inputmode="tel" autocomplete="tel" value="${esc(bk.wa)}"></div></div>
      <div class="two"><div><label class="l">${t('tu_ciudad')}</label><input class="inp" id="bC" value="${esc(bk.ciudad)}"></div><div><label class="l">${t('yegua_nombre')}</label><input class="inp" id="bY" value="${esc(bk.yegua)}"></div></div>
      <div class="nav-b"><button class="btn" data-go="1">&larr; ${t('atras')}</button><button class="btn solid" data-go="3" id="b2n">${t('siguiente')} &rarr;</button></div>`;
  } else {
    h = `<div class="sum"><img src="${esc(s.fotos[0])}" alt=""><div><b>${esc(s.nombre)}</b><span>${esc(s.apodo)} · ${t('mod_' + bk.mod)}</span></div></div>
      <div class="lines2"><div><span>${t('precio_maquila')}</span><span>${s.precio_maquila_mxn ? money(s.precio_maquila_mxn) : t('a_consultar')}</span></div>
      <div><span>${t('anticipo')}</span><b>${money(D.sitio.apartado_mxn)}</b></div></div>
      <p class="small">${t('resto')}</p>
      <div class="pay"><button class="btn solid" data-pay>${t('pagar_tarjeta')}</button><button class="btn" data-pay>${t('pagar_mp')}</button><button class="btn" data-pay>${t('pagar_spei')}</button><button class="btn wa" data-call>${WA_ICON}${t('pagar_llamada')}</button></div>
      <div class="demo" id="demo"></div>
      <div class="nav-b"><button class="btn" data-go="2">&larr; ${t('atras')}</button><span></span></div>`;
  }
  $('#bk').innerHTML = h;
  if (bk.step === 2) { const v = () => { $('#b2n').disabled = !($('#bN').value.trim() && $('#bW').value.trim()); }; ['bN', 'bW'].forEach(i => $('#' + i).addEventListener('input', v)); v(); }
  snap('#bPicks');
}
$('#bk').addEventListener('change', e => { if (e.target.name === 'bm') bk.mod = e.target.value; });
$('#bk').addEventListener('click', e => {
  const p = e.target.closest('#bPicks .pick'); if (p) { bk.id = p.dataset.id; $('#bPicks').querySelectorAll('.pick').forEach(x => x.classList.toggle('on', x === p)); return; }
  const g = e.target.closest('[data-go]');
  if (g) { if (bk.step === 2) { bk.nombre = $('#bN').value.trim(); bk.wa = $('#bW').value.trim(); bk.ciudad = $('#bC').value.trim(); bk.yegua = $('#bY').value.trim(); } bk.step = +g.dataset.go; renderBook(); return; }
  if (e.target.closest('[data-pay]')) { $('#demo').innerHTML = `<b>${t('demo_titulo')}</b><p>${t('demo_texto')}</p>`; $('#demo').classList.add('on'); }
  if (e.target.closest('[data-call]')) { $('#demo').innerHTML = `<b>${t('llamada_t')}</b>`; $('#demo').classList.add('on'); }
});

function renderLinks() {
  const s = D.sitio, l = [];
  l.push(`<a class="btn wa" target="_blank" rel="noopener" href="${waLink(L === 'es' ? 'Hola, tengo una pregunta' : 'Hi, I have a question')}">${WA_ICON}${t('whatsapp')}</a>`);
  if (s.instagram) l.push(`<a class="btn" target="_blank" rel="noopener" href="https://instagram.com/${esc(s.instagram)}">${t('instagram')}</a>`);
  $('#links').innerHTML = l.join('');
}

document.querySelectorAll('.lang button').forEach(b => b.onclick = () => { L = b.dataset.l; try { localStorage.setItem('mqh-lang', L); } catch (e) {} render(); });
addEventListener('scroll', () => $('#hdr').classList.toggle('solid', scrollY > 60), { passive: true });
function observe() {
  if (!('IntersectionObserver' in window)) { document.querySelectorAll('.reveal').forEach(e => e.classList.add('in')); return; }
  const io = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { x.target.classList.add('in'); io.unobserve(x.target); } }), { threshold: .1 });
  document.querySelectorAll('.reveal').forEach(e => io.observe(e));
}
</script>
</body>
</html>
