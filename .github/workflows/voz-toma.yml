name: Voz de Jesus en una toma (ElevenLabs)
on:
  push:
    branches: ["claude/**"]
    paths: ["tools/voz/toma/*.json"]
permissions:
  contents: write
jobs:
  voz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env: { ELEVENLABS_API_KEY: "${{ secrets.ELEVENLABS_API_KEY }}" }
        run: |
          for g in tools/voz/toma/*.json; do n=$(basename $g .json); [ -f tools/voz/salida/toma-$n/toma.mp3 ] || python3 tools/voz/elevenlabs_toma.py $g tools/voz/salida/toma-$n || true; done
      - run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add tools/voz/salida && git commit -m "Voz en una toma generada" && git push || true
