name: Voz de Jesus (ElevenLabs)
on:
  push:
    branches: ["claude/**"]
    paths: ["tools/voz/jesus/*.json"]
permissions:
  contents: write
jobs:
  voz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env: { ELEVENLABS_API_KEY: "${{ secrets.ELEVENLABS_API_KEY }}" }
        run: |
          for g in tools/voz/jesus/*.json; do n=$(basename $g .json); [ -d tools/voz/salida/jesus-$n ] || python3 tools/voz/elevenlabs.py $g tools/voz/salida/jesus-$n; done
      - run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add tools/voz/salida && git commit -m "Voz de Jesus generada" && git push || true
